<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop Manager</title>
<style>
:root{--r:#e30d40;--r2:#ff416b;--bg:#070307;--glass:#ffffff10;--line:#ffffff20;--muted:#cbbbc0}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}body{min-height:100dvh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;z-index:-5;background:radial-gradient(circle at 50% 25%,#ef174d,transparent 34%),radial-gradient(circle at 15% 80%,#8d0829,transparent 35%),#080308;animation:aurora 9s ease-in-out infinite alternate}
body:after{content:"";position:fixed;inset:-20px;z-index:-4;background:linear-gradient(100deg,#000b,#0002,#000b),url("https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=2000&q=85") center/cover;filter:blur(16px);opacity:.43}
@keyframes aurora{to{transform:scale(1.12) rotate(3deg)}}@keyframes pulse{50%{box-shadow:0 0 0 11px #ff315e00}}
.wrap{width:min(1160px,100%);margin:auto;padding:20px}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;font-weight:950;letter-spacing:.22em}.status{display:flex;gap:8px;align-items:center;padding:9px 13px;border:1px solid var(--line);background:#ffffff0d;backdrop-filter:blur(18px);border-radius:999px;font-size:11px;font-weight:900}.status i{width:8px;height:8px;border-radius:50%;background:#40f49a;box-shadow:0 0 14px #40f49a;animation:pulse 1.8s infinite}.status.closed i{background:#ff315e;box-shadow:0 0 14px #ff315e}
.hero{min-height:75vh;display:grid;place-items:center;text-align:center;position:relative}.orb{position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ff91a8,#e30d40 32%,#65041d 65%,transparent 70%);filter:blur(2px);opacity:.7;animation:float 6s ease-in-out infinite;z-index:-1}@keyframes float{50%{transform:translateY(-13px)}}
.eyebrow{font-size:11px;letter-spacing:.25em;color:#d8c8cc;font-weight:900}.hero h1{font-size:clamp(58px,12vw,150px);line-height:.78;letter-spacing:-.09em;margin:22px 0;font-weight:1000;text-shadow:0 25px 70px #000}.hero p{max-width:620px;color:var(--muted);font-size:17px;margin:0 auto 28px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#ffffff0d;color:#fff;border-radius:16px;padding:13px 17px;font-weight:850;text-decoration:none;cursor:pointer;backdrop-filter:blur(18px)}.btn.primary{background:linear-gradient(135deg,var(--r2),var(--r));border-color:transparent;box-shadow:0 15px 45px #e30d4038}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:10px 0 65px}.card{padding:20px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(22px);border-radius:24px}.label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#ab9ca0}.value{font-weight:900;font-size:17px;margin-top:7px}footer{text-align:center;border-top:1px solid var(--line);padding:25px 0 35px;color:#bcaeb2;font-size:13px}
.overlay{position:fixed;inset:0;z-index:50;background:#030003d9;backdrop-filter:blur(22px);display:none;align-items:center;justify-content:center;padding:9px}.overlay.show{display:flex}.popup{width:min(850px,100%);height:min(780px,calc(100dvh - 18px));border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,#430718ed,#090509f5);box-shadow:0 40px 120px #000;position:relative;overflow:hidden}.close{position:absolute;right:14px;top:14px;z-index:5;width:45px;height:45px;border-radius:50%;border:1px solid var(--line);background:#0006;color:#fff;font-size:23px;cursor:pointer}.popup-inner{height:100%;display:flex;flex-direction:column;padding:clamp(20px,4vw,38px);position:relative}.popup-kicker{font-size:10px;letter-spacing:.2em;color:#ff8ba0;font-weight:950}.popup h2{font-size:clamp(38px,7vw,70px);line-height:.9;letter-spacing:-.06em;margin:9px 0 18px}.slides{flex:1;min-height:0;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.slides::-webkit-scrollbar{display:none}.slide{min-width:100%;scroll-snap-align:center;border:1px solid var(--line);background:#ffffff0a;border-radius:24px;padding:clamp(20px,5vw,45px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;overflow:auto}.slide h3{font-size:clamp(42px,9vw,84px);line-height:.9;letter-spacing:-.07em;margin:8px 0 18px}.slide p{max-width:680px;color:#d9c9cd;font-size:17px;line-height:1.55;margin:0 0 18px}.timer{font-size:clamp(34px,8vw,68px);font-weight:1000;font-variant-numeric:tabular-nums}.small{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:#9e8f94;line-height:1.5}.old{text-decoration:line-through;color:#928389}.deal{color:#ff6a87;font-size:28px;font-weight:1000}.hint{text-align:center;color:#998a8f;font-size:11px;padding-top:9px}.error{text-align:center;padding:40px;color:#ffd1db}
@media(max-width:650px){.wrap{padding:15px}.grid{grid-template-columns:1fr}.hero{min-height:72vh}.hero h1{font-size:68px}.popup{height:calc(100dvh - 16px);border-radius:25px}.popup-inner{padding:20px 15px 14px}.popup h2{font-size:42px;padding-right:50px}.slide{padding:22px 18px}.slide h3{font-size:clamp(40px,12vw,62px)}.slide p{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
<nav class="nav"><div class="brand" id="brand">SHOP MANAGER</div><div class="status" id="status"><i></i><span id="statusText">OPEN</span></div></nav>
<main class="hero"><div class="orb"></div><div><div class="eyebrow" id="type">SHOP</div><h1 id="name">SHOP</h1><p id="tagline">A live digital presence for this shop.</p><div class="actions"><a class="btn primary" id="call">Call</a><a class="btn" id="wa" target="_blank" rel="noopener">WhatsApp</a><a class="btn" id="map" target="_blank" rel="noopener">Location</a><button class="btn" id="updates">Updates</button></div></div></main>
<section class="grid"><div class="card"><div class="label">Store type</div><div class="value" id="type2">—</div></div><div class="card"><div class="label">Owner</div><div class="value" id="owner">—</div></div><div class="card"><div class="label">Phone</div><div class="value" id="phone">—</div></div></section>
<footer id="address">—</footer>
</div>
<div class="overlay" id="overlay"><div class="popup"><button class="close" id="close">×</button><div class="popup-inner"><div class="popup-kicker">LIVE SHOP UPDATE</div><h2>Right now.</h2><div class="slides" id="slides"></div><div class="hint" id="hint"></div></div></div></div>
<script>
const SUPABASE_URL="https://wzoatpjewfphxcclxpmz.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6b2F0cGpld2ZwaHhjY2x4cG16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MjE5MDksImV4cCI6MjEwNTM5NzkwOX0.MpcEGav98i-wAWgsD3ep8DNcUr-Jg0N-hYm4bTWFTqU";
const SLUG=(new URLSearchParams(location.search).get("shop")||"").trim().toLowerCase();
let shop=null,lastClosed=null,popupSig="";
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function countdown(iso){let n=new Date(iso)-Date.now();if(n<=0)return"00:00:00";let s=Math.floor(n/1000),d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return(d?d+"d ":"")+`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function hm(v){let a=String(v||"").slice(0,5).split(":").map(Number);return(a[0]||0)*60+(a[1]||0)}
function schedule(){if(!shop?.schedule_enabled||!shop.daily_open_time||!shop.daily_close_time)return{enabled:false,closed:false,next:null};let o=hm(shop.daily_open_time),c=hm(shop.daily_close_time),n=new Date(),x=n.getHours()*60+n.getMinutes();if(o===c)return{enabled:true,closed:true,next:null};let open=o<c?(x>=o&&x<c):(x>=o||x<c);if(open)return{enabled:true,closed:false,next:null};let d=new Date();d.setSeconds(0,0);d.setMilliseconds(0);d.setHours(Math.floor(o/60),o%60,0,0);if(d<=n)d.setDate(d.getDate()+1);return{enabled:true,closed:true,next:d.toISOString()}}
function state(){if(!shop)return{closed:false,next:null,reason:null};if(shop.status==="closed"&&shop.reopen_at&&new Date(shop.reopen_at)>new Date())return{closed:true,next:shop.reopen_at,reason:"manual"};let s=schedule();return s.closed?{closed:true,next:s.next,reason:"schedule"}:{closed:false,next:null,reason:null}}
function infoActive(){let i=shop?.info;if(!i?.createdAt)return false;return !i.endAt||new Date(i.endAt)>new Date()}
function offerActive(){let o=shop?.offer;return !!(o?.endAt&&new Date(o.endAt)>new Date())}
function signature(){let s=state();return JSON.stringify({closed:s.closed,next:s.next,offer:shop?.offer,info:shop?.info})}
function render(){if(!shop)return;let s=state();$("brand").textContent=shop.shop_name;$("name").innerHTML=esc(shop.shop_name).replace(/\s+/g,"<br>");$("type").textContent=shop.store_type;$("type2").textContent=shop.store_type;$("owner").textContent=shop.owner_name;$("phone").textContent=shop.phone;$("address").textContent=shop.address||"";$("call").href="tel:"+String(shop.phone||"").replace(/[^\d+]/g,"");$("wa").href="https://wa.me/"+String(shop.phone||"").replace(/\D/g,"")+"?text="+encodeURIComponent("Hello, I'd like to enquire.");$("map").href=shop.latitude!=null&&shop.longitude!=null?"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(shop.latitude+","+shop.longitude):"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(shop.address||shop.shop_name||"");$("status").classList.toggle("closed",s.closed);$("statusText").textContent=s.closed?"CLOSED":"OPEN";$("tagline").textContent=s.closed?(s.reason==="manual"?(shop.closed_message||"Shop is currently closed."):"Shop is currently outside today's opening hours."):"A live digital presence for this shop.";renderSlides()}
function renderSlides(){if(!shop)return;let a=[],s=state();if(s.closed)a.push(`<article class="slide"><div class="popup-kicker">SHOP STATUS</div><h3>We're<br>closed.</h3><p>${esc(s.reason==="manual"?(shop.closed_message||"Please check back later."):"We're currently outside today's opening hours.")}</p>${s.next?`<div class="timer" data-count="${esc(s.next)}">${countdown(s.next)}</div><div class="small">Until next opening · live countdown</div>`:""}</article>`);let o=shop.offer;if(offerActive())a.push(`<article class="slide"><div class="popup-kicker">LIMITED OFFER</div><h3>${esc(o.name)}</h3><p>${esc(o.message||"Limited-time offer.")}</p><p><span class="old">${esc(o.oldPrice)}</span> &nbsp; <span class="deal">${esc(o.deal)}</span></p><div class="timer" data-count="${esc(o.endAt)}">${countdown(o.endAt)}</div><div class="small">Offer ends · live countdown</div></article>`);let i=shop.info;if(infoActive())a.push(`<article class="slide"><div class="popup-kicker">CUSTOM INFORMATION</div><h3>${esc(i.title)}</h3><p style="white-space:pre-wrap">${esc(i.message)}</p><div class="small">${i.endAt?`Expires · ${new Date(i.endAt).toLocaleString()}`:"No automatic expiry"}</div></article>`);$("slides").innerHTML=a.length?a.join(""):`<article class="slide"><div class="popup-kicker">ALL CLEAR</div><h3>No active updates.</h3><p>New shop updates will appear here.</p></article>`;$("hint").textContent=a.length>1?"Swipe to see all updates":""}
function active(){let s=state();return s.closed||offerActive()||infoActive()}
async function load(){if(!SLUG){$("name").textContent="SHOP LINK MISSING";$("type").textContent="ADD ?shop=YOUR-SLUG";return}try{let r=await fetch(SUPABASE_URL+"/rest/v1/rpc/get_shop_public_by_slug",{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({shop_slug:SLUG})});let t=await r.text();if(!r.ok)throw Error(t);shop=t?JSON.parse(t):null;if(!shop)throw Error("Shop not found");render();let sig=signature();if(active()&&sig!==popupSig){$("overlay").classList.add("show");popupSig=sig}}catch(e){console.error(e);$("name").textContent="SHOP NOT FOUND";$("type").textContent="CHECK SHOP LINK";$("tagline").textContent="The shop could not be loaded."}}
$("updates").onclick=()=>{$("overlay").classList.add("show");renderSlides()};$("close").onclick=()=>$("overlay").classList.remove("show");
setInterval(()=>{if(!shop)return;document.querySelectorAll("[data-count]").forEach(e=>e.textContent=countdown(e.dataset.count));let c=state().closed;if(c!==lastClosed){lastClosed=c;render()}},1000);
load();
</script>
</body></html>
